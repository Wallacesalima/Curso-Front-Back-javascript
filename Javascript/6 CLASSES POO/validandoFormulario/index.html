<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <section class="container">
        <h1>Formulário de cadastro</h1>

            <ul class="regras">
                <li>Nenhum campo pode ser vazio</li>
                <li>Usuário só poderá conter letras e/ou números</li>
                <li>Usuário deverá ter entre 3 e 12 caracteres</li>
                <li>Senha precisa ter entre 6 e 12 caracteres</li>
            </ul>

        <form action="/" method="post" class="formulario">

            <label for="input-teste-1">Nome</label>
            <input type="text" class="nome validar ">

            <label for="input-teste-2">Sobrenome</label>
            <input type="text" class="isobrenome validar">

            <label for="input-teste-3">CPF</label>
            <input type="text" class="cpf validar">

            <label for="input-teste-3">Usuário</label>
            <input type="text" class="usuario validar">

            <label for="input-teste-4">Senha</label>
            <input type="password" class="senha validar">

            <label for="input-teste-4">Repetir senha</label>
            <input type="password" class="repetir_senha validar">

            <button type="submit">Enviar</button>
        </form>

    </section>
    <script src="assets/js/validandoCPF.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
